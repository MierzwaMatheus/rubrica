<!doctype html>
<html lang="pt-BR" class="dark" data-color-mode="dark" data-color-toggle="false" data-texture="none">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <!-- Título e descrição básica -->
    <title>Rubrica Portfolio</title>
    <meta
      name="description"
      content="A professional portfolio template."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" />
    <meta property="og:title" content="Rubrica Portfolio" />
    <meta
      property="og:description"
      content="A professional portfolio template."
    />
    <meta property="og:image" content="" />
    <meta property="og:site_name" content="Rubrica Portfolio" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="" />
    <meta property="twitter:title" content="Rubrica Portfolio" />
    <meta
      property="twitter:description"
      content="A professional portfolio template."
    />
    <meta property="twitter:image" content="" />
    <meta property="twitter:creator" content="" />

    <!-- Configurações adicionais -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="author" content="Portfolio Author" />
    <meta
      name="keywords"
      content="portfolio, developer, web development"
    />

    <!-- Favicon e ícones -->
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Portfolio RSS Feed"
      href="/rss.xml"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Modo de cor e textura (data-* do <html>, gravados pelo CLI). Roda antes da
         página aparecer para não piscar o modo errado. Fica num arquivo porque a CSP
         do site publicado bloqueia script embutido. -->
    <script src="/color-mode.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
