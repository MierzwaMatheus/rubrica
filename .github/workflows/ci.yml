name: CI

# Rubrica v2 (monorepo pnpm). A v1 vive na branch `v1`, com o próprio CI.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Bateria completa (todos os temas, com Lighthouse) toda noite, às 3h de Brasília, e sob demanda.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-test:
    name: Tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          playwright: "true" # os testes do theme-tester abrem o Chromium
      - run: pnpm -r check
      - run: pnpm -r test

  demo:
    name: Build da demo (${{ matrix.site }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        site: [pessoal, empresa]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        run: |
          if [ ! -f "apps/demo/fixtures/${{ matrix.site }}/site.json" ]; then
            echo "::warning::sem fixtures de ${{ matrix.site }}; build pulado"
            exit 0
          fi
          SITE=${{ matrix.site }} pnpm --filter @rubrica/demo build

  themes:
    name: Temas a testar
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      any: ${{ steps.list.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o diff contra a base precisa do histórico
      # Só os temas que a mudança afeta (`.github/scripts/ci-temas.mjs`); todos no agendamento noturno e no disparo manual.
      - id: list
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          TODOS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--todos' || '' }}
        run: node .github/scripts/ci-temas.mjs "$BASE" "$HEAD" $TODOS

  battery:
    name: Bateria (${{ matrix.theme }})
    needs: themes
    if: needs.themes.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.themes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
      # Um job por tema: axe, SEO, JavaScript por página e hidratação; o Lighthouse junto quando o tema mudou (ou à noite).
      - name: Bateria do tema
        run: pnpm testar-tema ${{ matrix.theme }} ${{ !matrix.lighthouse && '--sem-lighthouse' || '' }} --json "$RUNNER_TEMP/bateria.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bateria-${{ strategy.job-index }}
          path: ${{ runner.temp }}/bateria.json
          if-no-files-found: ignore
